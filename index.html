<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Acceso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="fenixomega.jpg" alt="Fénix Omega" />
    </div>
    <audio id="audio" src="omega.wav" loop></audio>

    <center>
        <p style="font-weight: bold; font-size: 22px;">INGRESE CÓDIGO DESACTIVACION:</p>
        <input type="password" id="password" placeholder="CÓDIGO" oninput="displayPassword()">
        <button onclick="checkPassword()">AUTORIZAR</button>
        <button id="playAudio" onclick="playAudio()">Reproducir Audio</button>
        <div id="error-message" style="display: none; font-weight: bold; font-size: 18px;"></div>
        <div id="password-display"></div>
    </center>

    <script>
        function checkPassword() {
            const password = document.getElementById("password").value.toUpperCase();
            
            if (password === "MNX-09-REV") {
                window.location.href = "final.html";
                return;
            }

            document.getElementById("error-message").style.display = "block";
            document.getElementById("error-message").textContent = "ERROR DE CODIGO";
        }

        function displayPassword() {
            const password = document.getElementById("password").value.toUpperCase();
            document.getElementById("password-display").textContent = "CÓDIGO INGRESADO: " + password;
        }

        function playAudio() {
            document.getElementById("audio").play();
            document.getElementById("playAudio").style.display = "none";
        }
    </script>
</body>
</html>
